name: Verify Android and publish calculator update
on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - updates/stable.json
permissions:
  contents: write
concurrency:
  group: calculator-stable-release
  cancel-in-progress: false
jobs:
  # Blocking gate: nothing is advertised to users until the published APK and its
  # metadata (package, version, certificate, size, SHA-256, apkUrl) are verified.
  verify-and-publish:
    name: Verify published APK and update the stable channel
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read the exact public repository commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Stage exact APK and metadata from the published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          [[ "$tag" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]] || { echo "Invalid stable release tag: $tag"; exit 1; }
          version="${tag#v}"
          staging="$RUNNER_TEMP/calculator-published-release"
          mkdir -p "$staging"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$staging" --pattern "Calculator-UMEDJON-${version}.apk" --pattern "update.json"
          test -s "$staging/Calculator-UMEDJON-${version}.apk"
          test -s "$staging/update.json"
          cp "$staging/Calculator-UMEDJON-${version}.apk" release-input/Calculator-UMEDJON-current.apk
          cp "$staging/update.json" release-input/update.json
          python3 - "$tag" <<'PY'
          import json, sys
          from pathlib import Path
          data=json.loads(Path('release-input/update.json').read_text())
          assert 'v'+data['versionName']==sys.argv[1], 'Release tag does not match update metadata'
          assert data['apkFileName']=='Calculator-UMEDJON-'+data['versionName']+'.apk'
          print('Staged published release:', sys.argv[1], 'versionCode:', data['versionCode'])
          PY
      - name: Verify APK signature and metadata
        run: python3 scripts/publish.py --verify-only
      - name: Publish verified signed APK and stable channel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish.py

  # Independent quality signal: the same instrumented phases as before. It never
  # gates the stable channel, so a flaky emulator cannot delay an already
  # verified update; its result is visible next to the blocking gate.
  android-tests:
    name: Android instrumentation tests (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ANDROID_AVD_HOME: /tmp/calculator-avd
    steps:
      - name: Read the exact public repository commit
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
      - name: Stage the APK of the release under test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            tag="$(jq -r '.release.tag_name' "$GITHUB_EVENT_PATH")"
          else
            tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          fi
          version="${tag#v}"
          staging="$RUNNER_TEMP/calculator-test-release"
          mkdir -p "$staging"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$staging" --pattern "Calculator-UMEDJON-${version}.apk"
          test -s "$staging/Calculator-UMEDJON-${version}.apk"
          cp "$staging/Calculator-UMEDJON-${version}.apk" release-input/Calculator-UMEDJON-current.apk
          test -s release-input/Calculator-UMEDJON-previous.apk
          test -s release-input/device-test.apk
      - name: Prepare Android 15 emulator
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sudo chmod 666 /dev/kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpulse0
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'emulator' 'system-images;android-35;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force -n calculator-api35 -p "$ANDROID_AVD_HOME/calculator-api35.avd" -k 'system-images;android-35;google_apis;x86_64'
          printf 'avd.ini.encoding=UTF-8\npath=%s\ntarget=android-35\n' "$ANDROID_AVD_HOME/calculator-api35.avd" > "$ANDROID_AVD_HOME/calculator-api35.ini"
      - name: Test preview and final announcements on Android
        run: |
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          emulator -list-avds
          emulator -version
          emulator -accel-check
          emulator -avd calculator-api35 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader -feature -Vulkan -memory 2048 > emulator.log 2>&1 &
          emulator_pid=$!
          trap 'cat emulator.log; adb logcat -d -t 100 || true' ERR
          for attempt in $(seq 1 150); do
            kill -0 "$emulator_pid" || { cat emulator.log; exit 1; }
            if [ "$(timeout 10s adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install release-input/Calculator-UMEDJON-previous.apk
          adb install -r release-input/Calculator-UMEDJON-current.apk
          adb install release-input/device-test.apk
          mkdir -p checks
          overall=0
          for phase in native announcements voice swipe hover; do
            adb shell am force-stop tj.umedjon.calculator
            ok=0
            for attempt in 1 2; do
              if timeout 120s adb shell am instrument -w -e phase "$phase" tj.umedjon.calculator.tests/tj.umedjon.calculator.tests.AccessibilitySmoke | tee "checks/${phase}.txt"; then
                if grep -q 'PASS: ' "checks/${phase}.txt" && ! grep -q 'FAIL\|INSTRUMENTATION_FAILED\|Process crashed' "checks/${phase}.txt"; then
                  ok=1; break
                fi
              fi
              echo "phase ${phase} attempt ${attempt} failed; retrying"
              sleep 5
            done
            if [ "$ok" != 1 ]; then overall=1; echo "::error::Instrumentation phase ${phase} failed twice"; fi
          done
          exit $overall
